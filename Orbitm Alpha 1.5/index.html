<script>
const $=i=>document.getElementById(i),cv=$('c'),ctx=cv.getContext('2d'),G=1,TAU=Math.PI*2;
const DEF={star:{m:20000,r:22,c:'#ffd27a',n:'Star'},planet:{m:20,r:6,c:'#5aa9ff',n:'Planet'},asteroid:{m:.01,r:1.6,c:'#a39b8f',n:'Asteroid'},bh:{m:60000,r:0,c:'#000000',n:'Black hole'}};
const P=JSON.parse(JSON.stringify(DEF));for(const k in P)P[k].name='';
const lum=b=>Math.pow(b.m/20000,3.5),
fD=u=>fx.real?(u<2?(u/200*149.6).toPrecision(3)+' M km':(u/200).toPrecision(3)+' '+tr('AU')):fmt(u)+' u',
fV=v=>fx.real?(v*2.98).toPrecision(3)+' km/s':fmt(v)+' u/s',
fT=t=>fx.real?(t>125.66?(t/125.66).toPrecision(3)+' '+tr('yr'):(t*2.906).toPrecision(3)+' '+tr('days')):fmt(t)+' s',
fM=m=>fx.real?(m>=3000?(m/20000).toPrecision(3)+' M☉':(m*16.65).toPrecision(3)+' M⊕'):fmt(m);
const bhR=m=>Math.max(4,m*2.5e-4),fmt=n=>n>=100?n.toFixed(0):n>=1?n.toFixed(2):n.toPrecision(2),esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let W,H,dpr=1,cam={x:0,y:0,z:1},bodies=[],S=[],cnt={},uid=1,tool='star',mode='point',dir=1,sf=1,paused=false,speed=1,showTr=true,showLb=true,mouse={x:0,y:0},parent=null,sel=null,pan=null,tAcc=0,aim=null,drag=null,velEdit=false,lastSel=null,dsx=0,dsy=0,fx={roche:1,hz:0,lag:0,real:0,lens:1},set={theme:'dark',q:1,sfx:1,amb:0,vol:.5,lang:(navigator.language||'en').slice(0,2)==='fr'?'fr':'en'},stats={broken:0,fed:0},gmode=0,tapOrb=null,ptrs=new Map(),pinch=null,tab='d',done={},inMenu=true,pmOpen=false,follow=null,hist=[],undoSt=[],rw=false;
const bg=Array.from({length:240},()=>({x:Math.random(),y:Math.random(),s:Math.random()*1.3+.3,d:Math.random()*2+.2}));
function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr}
addEventListener('resize',resize);resize();
const w2s=(x,y)=>[(x-cam.x)*cam.z+W/2,(y-cam.y)*cam.z+H/2],s2w=(x,y)=>[(x-W/2)/cam.z+cam.x,(y-H/2)/cam.z+cam.y];
const refresh=()=>{S=bodies.filter(b=>b.t!=='asteroid')};
function mk(t,name,m,r,c,x,y,vx,vy){cnt[t]=(cnt[t]||0)+1;const b={id:uid++,t,name:name||tr(DEF[t].n)+' '+cnt[t],m,r:t==='bh'?bhR(m):r,c,x,y,vx,vy,ax:0,ay:0,tr:[],age:0,h:[]};bodies.push(b);refresh();return b}
function orbitVel(p,x,y,m,d=dir,f=sf){const rx=x-p.x,ry=y-p.y,r=Math.hypot(rx,ry)||1e-6,v=Math.sqrt(G*(p.m+m)/r)*f;return[p.vx+d*ry/r*v,p.vy-d*rx/r*v]}
function place(wx,wy,ux=0,uy=0){pushUndo();const p=P[tool],n=tool==='asteroid'?Math.max(1,Math.min(300,+$('cnt').value||1)):1;
 for(let i=0;i<n;i++){let x=wx,y=wy,a=Math.random()*TAU;
  if(n>1){if(mode==='orbit'&&parent){const R=Math.hypot(wx-parent.x,wy-parent.y)*(1+(Math.random()-.5)*.12);x=parent.x+Math.cos(a)*R;y=parent.y+Math.sin(a)*R}else{const R=Math.random()*25/cam.z;x+=Math.cos(a)*R;y+=Math.sin(a)*R}}
  const v=mode==='orbit'&&parent?orbitVel(parent,x,y,p.m):[ux,uy];
  mk(tool,p.name&&n>1?p.name+' '+(i+1):p.name,p.m,p.r,p.c,x,y,v[0],v[1]).mine=1}sfxPlace(tool)}
function accel(){for(const b of bodies){let ax=0,ay=0;for(const s of S){if(s===b)continue;const dx=s.x-b.x,dy=s.y-b.y,d2=dx*dx+dy*dy+4,k=G*s.m/(d2*Math.sqrt(d2));ax+=dx*k;ay+=dy*k}b.ax=ax;b.ay=ay}}
function merge(a,o){const M=a.m+o.m;a.x=(a.x*a.m+o.x*o.m)/M;a.y=(a.y*a.m+o.y*o.m)/M;a.vx=(a.vx*a.m+o.vx*o.m)/M;a.vy=(a.vy*a.m+o.vy*o.m)/M;a.r=a.t==='bh'?bhR(M):Math.cbrt(a.r**3+o.r**3);a.m=M;o.dead=1;if(a.t==='bh'&&o.t==='planet')stats.fed++;sfxMerge(a,o);if(sel===o)sel=a;if(parent===o)parent=null}
function collide(){let hit=false;for(const s of S){if(s.dead)continue;for(const b of bodies){if(b===s||b.dead||(b.t!=='asteroid'&&b.id<s.id))continue;const dx=b.x-s.x,dy=b.y-s.y,R=s.r+b.r;if(dx*dx+dy*dy<R*R){let a=s,o=b;if(b.t!=='asteroid'&&b.m>s.m){a=b;o=s}merge(a,o);hit=true;if(o===s)break}}}
 if(hit){bodies=bodies.filter(b=>!b.dead);refresh()}return hit}
function tidal(){let hit=false;for(const b of bodies){if(b.t!=='planet'||b.held||b.dead||b.safe)continue;for(const s of S){if(s===b||s.dead||s.m<b.m*8)continue;const dx=b.x-s.x,dy=b.y-s.y,lim=.7*b.r*Math.cbrt(s.m/b.m);if(dx*dx+dy*dy<lim*lim){shatter(b,s);hit=true;break}}}
 if(hit){bodies=bodies.filter(b=>!b.dead);refresh()}return hit}
function shatter(b,s){b.dead=1;if(sel===b)sel=null;if(parent===b)parent=null;const n=28,sp=Math.sqrt(G*b.m/b.r);
 for(let i=0;i<n;i++){const a=Math.random()*TAU,d=Math.random()*b.r;mk('asteroid',b.name+' '+tr('debris'),b.m/n,Math.max(.8,b.r/Math.cbrt(n)),b.c,b.x+Math.cos(a)*d,b.y+Math.sin(a)*d,b.vx+(Math.random()-.5)*sp,b.vy+(Math.random()-.5)*sp)}
 stats.broken++;sfxBreak();toast(tr('{0} was torn apart by {1}',b.name,s.name))}
function climN(b){let F=0,hz=false;for(const s of bodies){if(s.t!=='star')continue;const d=Math.hypot(s.x-b.x,s.y-b.y)/200,L=lum(s);F+=L/(d*d);if(d>.95*Math.sqrt(L)&&d<1.67*Math.sqrt(L))hz=true}
 return F<1e-4?null:{T:278*Math.pow(F*.7,.25)-273.15,hz}}
function climate(b){const c=climN(b);return c?'<br>'+tr(c.hz?'About {0} °C · in the habitable zone':'About {0} °C · outside the habitable zone',Math.round(c.T)):'<br>'+tr('No star is heating it')}
function sim(dt){const n=Math.min(Math.ceil(dt/.01),300),h=dt/n;accel();
 for(let k=0;k<n;k++){for(const b of bodies){if(b.held)continue;b.vx+=b.ax*h/2;b.vy+=b.ay*h/2;b.x+=b.vx*h;b.y+=b.vy*h}accel();for(const b of bodies){if(b.held)continue;b.vx+=b.ax*h/2;b.vy+=b.ay*h/2}const th=fx.roche&&tidal();if(collide()||th)accel()}
 tAcc+=dt;for(const b of bodies)b.age+=dt;if(tAcc>.25){tAcc=0;hist.push(snapNow());if(hist.length>240)hist.shift();for(const b of bodies){b.tr.push(b.x,b.y);if(b.t!=='asteroid'||b===sel)sample(b);if(b.tr.length>(b.t==='asteroid'?240:1400))b.tr.splice(0,2)}}}
function trace(p,x,y,u,v,mu){const r0=Math.hypot(x,y);if(r0<1e-3)return null;const sp=Math.hypot(u,v),a=1/(2/r0-sp*sp/mu),per=a>0?TAU*Math.sqrt(a**3/mu):null,h=.004*Math.sqrt(r0**3/mu),pts=[w2s(p.x+x,p.y+y)];let ang=0;
 const k=sp*sp-mu/r0,d=x*u+y*v,ecc=Math.hypot((k*x-d*u)/mu,(k*y-d*v)/mu);
 for(let i=0;i<5000;i++){let r3=Math.hypot(x,y)**3;u-=mu*x/r3*h/2;v-=mu*y/r3*h/2;const ox=x,oy=y;x+=u*h;y+=v*h;r3=Math.hypot(x,y)**3;u-=mu*x/r3*h/2;v-=mu*y/r3*h/2;
  ang+=Math.abs(Math.atan2(ox*y-oy*x,ox*x+oy*y));const r=Math.hypot(x,y);if(i%6===0)pts.push(w2s(p.x+x,p.y+y));if(ang>6.3||r<p.r||r>r0*30)break}
 return{pts,per,sp,ecc}}
function predict(px,py,m){const p=parent,[vx,vy]=orbitVel(p,px,py,m);return trace(p,px-p.x,py-p.y,vx-p.vx,vy-p.vy,G*(p.m+m))}
function primaryOf(b){let best=null,bk=0;for(const s of S){if(s===b||s.m<=b.m)continue;const dx=s.x-b.x,dy=s.y-b.y,k=s.m/(dx*dx+dy*dy+1);if(k>bk){bk=k;best=s}}return best}
function actual(b){const p=primaryOf(b);if(!p)return null;const o=trace(p,b.x-p.x,b.y-p.y,b.vx-p.vx,b.vy-p.vy,G*(p.m+b.m));return o&&{p,...o}}
function dotted(pts,col){ctx.strokeStyle=col;ctx.lineWidth=2.2;ctx.lineCap='round';ctx.setLineDash([.1,7]);ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke();ctx.setLineDash([]);ctx.lineCap='butt'}

const DICT=[
["star","Star","A huge, hot ball of gas that makes its own light. In Orbitm stars are usually the heavy centres that planets orbit. Stars that touch merge into one heavier star."],
["planet","Planet","A round body that orbits a star. Planets pull on other objects, so a heavy planet can keep moons. When planets collide they merge, and the new size keeps the total volume."],
["asteroid","Asteroid","A small rocky leftover. In Orbitm asteroids feel the pull of every star, planet and black hole but do not pull back, because their mass is too small to matter. They are absorbed by whatever they hit."],
["bh","Black hole","Mass packed so tightly that nothing, not even light, escapes from inside its event horizon. From far away it pulls like any other object of the same mass. In Orbitm it swallows whatever touches it."],
["horizon","Event horizon","The boundary around a black hole beyond which nothing can return. The real radius is 2GM/c². Orbitm draws a simplified size that grows with mass (mass × 0.00025, at least 4), so it is for gameplay, not to scale."],
["accretion","Accretion disk","Glowing gas spiralling into a black hole, heated by friction. In Orbitm the orange glow and ring are decoration only and do not change the physics."],
["mass","Mass","How much matter an object has. More mass means a stronger pull on other objects. Mass has no unit in Orbitm, the numbers only compare objects to each other."],
["gravity","Gravity","Every object with mass attracts every other one. Newton's law says the pull is G × m1 × m2 / distance². Double the distance and the pull drops to a quarter. Orbitm computes this between every pair of objects at each step."],
["g","Gravitational constant (G)","The number that sets how strong gravity is. Orbitm uses G = 1 to keep numbers simple. In real SI units it is about 6.67 × 10⁻¹¹."],
["orbit","Orbit","Falling around something instead of into it. An orbiting object moves sideways fast enough that it keeps missing the thing it falls toward."],
["circular","Circular orbit","An orbit at constant distance. The needed speed is √(G × M / r), where M is the mass being orbited and r the distance. Orbit placement with speed ×1.00 gives this."],
["elliptical","Elliptical orbit","An oval orbit. Starting slower than circular makes the object fall closer and speed up near the centre. Starting faster makes it swing further out. The body being orbited sits at one focus of the oval, not in the middle."],
["eccentricity","Eccentricity","How stretched an orbit is. 0 is a circle, between 0 and 1 is an ellipse, 1 is a parabola, and above 1 is a hyperbola (the object never comes back). Shown in the Inspect panel."],
["period","Orbital period","The time for one full orbit, in simulation seconds. Bigger orbits take longer: the square of the period grows with the cube of the orbit size (Kepler's third law)."],
["speed","Speed","How fast an object moves, in units per second (u/s). On an orbit it is fastest at the closest point and slowest at the farthest."],
["escape","Escape velocity","The speed needed to leave for good, about 1.41 (√2) times the circular speed. The orbit speed slider goes up to 1.5, so you can try it."],
["point","Point placement","The object starts at rest, so it falls toward the nearest mass. Drag before releasing to launch it with a velocity instead."],
["orbitplace","Orbit placement","You pick the object to orbit, then place the new one. Orbitm gives it the speed for an orbit around that object, plus that object's own velocity, so moons follow their planet. The dotted preview ignores pulls from other bodies."],
["launch","Launch velocity","When you drag in point placement, the gold arrow shows direction and speed. Every 2 units of drag equal 1 u/s. The gold dotted line is the path around the body pulling hardest. You can do the same to a placed object with Set velocity."],
["dotted","Dotted lines","Green: preview of the orbit you are placing. White: current orbit of the selected object, recomputed every frame. Gold: launch path. They assume only the strongest-pulling body acts, so the real path can drift."],
["primary","Primary body","The heavier body an object mainly orbits. Orbitm picks the heavier body that pulls hardest on the selected object. The biggest object in a system has no primary."],
["momentum","Momentum","Mass × velocity. When objects merge, total momentum is conserved: the new object moves at the mass-weighted average velocity. A heavy planet barely notices a small asteroid hitting it."],
["merge","Collisions and merging","Objects that touch merge. The heavier star, planet or black hole keeps its identity, and asteroids are always absorbed. Mass adds up, momentum is conserved, and size grows so that volume adds up. Real impacts make debris and heat, which Orbitm leaves out."],
["barycenter","Barycenter","The centre of mass of a group of bodies. They orbit it rather than each other's centres. A heavy planet makes its star wobble slightly, and Orbitm shows this because every body pulls on every other."],
["hill","Hill sphere","The region around a planet where its gravity wins over the star's. Moons must stay inside, and in practice within about half of it, to remain stable. Radius ≈ distance to star × (planet mass / 3 × star mass)^(1/3)."],
["softening","Softening","A small number added to the squared distance in the gravity formula so that two objects passing very close do not get an infinite kick. Orbitm adds 4 to distance²."],
["integration","Leapfrog integration","The simulation advances in tiny steps (at most 0.01 s) and updates speed and position alternately. This keeps orbits stable for a long time, where simpler methods slowly drift outward."],
["trail","Trails","Faint lines showing where an object has been, with one point every 0.25 s of simulated time. Turn them off with the Trails button."],
["roche","Roche limit and tidal breakup","Come too close to a heavy body and the difference in its pull across an object can tear it apart. In Orbitm a planet that crosses the limit (0.7 × its size × the cube root of the mass ratio, a simplified formula) breaks into 28 asteroids that keep its momentum. The fragments do not pull on others. Toggle: Tidal breakup."],
["habitable","Habitable zone","The band around a star where a planet could hold liquid water. Orbitm gives each star a brightness from its mass (mass^3.5, compared with the 20,000 reference star) and shades 0.95 to 1.67 AU × the square root of that. Planet temperatures assume 30% reflectivity and no greenhouse effect."],
["lagrange","Lagrange points","Five spots near two orbiting bodies where a small object can keep pace with them. L1, L2 and L3 lie on the line through both bodies and are unstable. L4 and L5 sit 60° ahead of and behind the smaller body and can be stable when the larger body is at least about 25 times heavier. Orbitm draws approximate positions for the selected object and its primary."],
["lensing","Gravitational lensing","A massive object bends passing light, so background stars look pushed outward around a black hole, and ones right behind it vanish. Orbitm uses a simple point-lens formula. It is visual only."],
["jets","Disk spin and jets","Gas in an accretion disk circles faster closer to the hole, and the side moving toward you looks brighter. Black holes can also fire jets along their spin axis. Orbitm animates the disk and draws two jets for looks only. They push nothing."],
["follow","Follow camera","The camera can lock onto a selected object, or onto the centre of mass of everything in the system, and glide along with it. Moving the view by hand releases the lock. Following the centre of mass keeps a whole system in view even if it drifts."],
["rewind","Undo and rewind","Undo (Ctrl+Z) reverses your last edits: placing, deleting, editing and loading. Rewind steps back through the last 60 seconds of simulation. Drag the slider to scrub, then press Play from here to continue from that moment, which discards the later history. Trails are cleared when you jump back."],
["energy","Orbital energy","Specific orbital energy is v²/2 − μ/r, where μ = G × (both masses). Negative means the orbit is bound, zero is a parabola, and positive means the object will escape. On an undisturbed orbit it stays constant, so changes in the graph show other bodies pulling or a close pass."],
["units","Units","Normally distance is in u, time in simulation seconds, and mass has no unit. Real units converts with 200 u = 1 AU, 20,000 mass = 1 solar mass and 125.66 s = 1 year, which gives an Earth-like orbit speed of 29.8 km/s. Sizes are exaggerated to stay visible, so only masses, distances, speeds and times are converted."]];

/* ===== Alpha 1.5: follow, undo/rewind, presets, French ===== */
const snapNow=()=>({b:bodies.map(b=>[b.id,b.t,b.name,b.m,b.r,b.c,b.x,b.y,b.vx,b.vy,b.age,b.mine?1:0,b.safe?1:0])});
function loadSnap(sn){const pi=parent&&parent.id,si=sel&&sel.id,fi=follow&&follow!=='com'?follow.id:null;
 bodies=sn.b.map(a=>({id:a[0],t:a[1],name:a[2],m:a[3],r:a[4],c:a[5],x:a[6],y:a[7],vx:a[8],vy:a[9],age:a[10],mine:a[11]?1:0,safe:a[12]?1:0,ax:0,ay:0,tr:[],h:[]}));refresh();
 const f=i=>i==null?null:bodies.find(b=>b.id===i)||null;parent=f(pi);sel=f(si);if(fi!=null)follow=f(fi);folLabel()}
function pushUndo(){undoSt.push(snapNow());if(undoSt.length>60)undoSt.shift()}
function undo(){if(!undoSt.length){toast(tr('Nothing to undo'));return}loadSnap(undoSt.pop())}
$('undo').onclick=undo;
['sname','smass','srd','sc'].forEach(i=>$(i).addEventListener('focus',pushUndo));
function rwButton(){$('rw').textContent=tr(rw?'Play from here':'Rewind');$('rw').classList.toggle('on',rw);$('rws').classList.toggle('hide',!rw);$('rwl').classList.toggle('hide',!rw)}
function clearRW(){if(rw){rw=false;paused=false;$('pause').textContent=tr('Pause')}rwButton()}
function endRW(){if(!rw)return;const i=+$('rws').value;rw=false;hist.length=i+1;loadSnap(hist[i]);paused=false;$('pause').textContent=tr('Pause');rwButton()}
$('rw').onclick=()=>{if(rw){endRW();return}if(hist.length<2){toast(tr('Not enough history yet'));return}rw=true;paused=true;$('pause').textContent=tr('Resume');$('rws').max=hist.length-1;$('rws').value=hist.length-1;$('rwl').textContent='0.0 s';rwButton()};
$('rws').oninput=e=>{const i=+e.target.value;loadSnap(hist[i]);$('rwl').textContent='−'+((hist.length-1-i)*.25).toFixed(1)+' s'};
function folTarget(){if(!follow)return null;if(follow==='com'){let M=0,x=0,y=0;for(const b of bodies){M+=b.m;x+=b.m*b.x;y+=b.m*b.y}return M?[x/M,y/M]:null}if(!bodies.includes(follow)){follow=null;folLabel();return null}return[follow.x,follow.y]}
function folLabel(){$('fol').textContent=tr('Follow')+': '+(follow?follow==='com'?tr('centre of mass'):follow.name:tr('off'));$('fol').classList.toggle('on',!!follow)}
$('fol').onclick=()=>{follow=!follow?(sel||'com'):follow!=='com'?'com':null;folLabel()};
$('sfol').onclick=()=>{if(sel){follow=sel;folLabel()}};

const DFR={star:['Étoile','Une énorme boule de gaz très chaude qui produit sa propre lumière. Dans Orbitm, les étoiles sont en général les corps lourds autour desquels tournent les planètes. Deux étoiles qui se touchent fusionnent en une étoile plus lourde.'],
planet:['Planète','Un corps rond qui tourne autour d’une étoile. Les planètes attirent les autres objets : une planète lourde peut garder des lunes. Quand deux planètes se percutent, elles fusionnent et la nouvelle taille conserve le volume total.'],
asteroid:['Astéroïde','Un petit débris rocheux. Dans Orbitm, les astéroïdes subissent l’attraction de toutes les étoiles, planètes et trous noirs, mais n’attirent personne en retour : leur masse est trop faible pour compter. Ils sont absorbés par ce qu’ils touchent.'],
bh:['Trou noir','De la masse tassée si fort que rien, pas même la lumière, ne peut sortir de son horizon des événements. De loin, il attire comme n’importe quel objet de même masse. Dans Orbitm, il avale tout ce qui le touche.'],
horizon:['Horizon des événements','La frontière autour d’un trou noir au-delà de laquelle rien ne revient. Le rayon réel vaut 2GM/c². Orbitm dessine une taille simplifiée qui croît avec la masse (masse × 0,00025, au moins 4) : elle sert au jeu, pas à l’échelle.'],
accretion:['Disque d’accrétion','Du gaz qui tourbillonne vers un trou noir et que le frottement chauffe. Dans Orbitm, la lueur orange et l’anneau sont purement décoratifs et ne changent pas la physique.'],
mass:['Masse','La quantité de matière d’un objet. Plus de masse signifie une attraction plus forte sur les autres objets. Dans Orbitm, la masse n’a pas d’unité : les nombres servent seulement à comparer les objets.'],
gravity:['Gravité','Tout objet qui a une masse attire tous les autres. D’après la loi de Newton, la force vaut G × m1 × m2 / distance². Si la distance double, la force est divisée par quatre. Orbitm calcule cela entre chaque paire d’objets à chaque pas.'],
g:['Constante gravitationnelle (G)','Le nombre qui fixe l’intensité de la gravité. Orbitm prend G = 1 pour garder des nombres simples. En unités SI, elle vaut environ 6,67 × 10⁻¹¹.'],
orbit:['Orbite','Tomber autour de quelque chose au lieu de tomber dessus. Un objet en orbite avance de côté assez vite pour toujours manquer ce vers quoi il tombe.'],
circular:['Orbite circulaire','Une orbite à distance constante. La vitesse nécessaire est √(G × M / r), où M est la masse autour de laquelle on tourne et r la distance. Le placement en orbite avec une vitesse ×1,00 donne ce résultat.'],
elliptical:['Orbite elliptique','Une orbite ovale. Partir plus lentement qu’en orbite circulaire fait tomber l’objet plus près, et il accélère près du centre. Partir plus vite l’envoie plus loin. Le corps central est à un foyer de l’ovale, pas au milieu.'],
eccentricity:['Excentricité','À quel point une orbite est allongée. 0 est un cercle, entre 0 et 1 une ellipse, 1 une parabole, et au-dessus de 1 une hyperbole (l’objet ne revient jamais). Elle est affichée dans le panneau Inspecter.'],
period:['Période orbitale','Le temps d’un tour complet, en secondes de simulation. Les grandes orbites sont plus lentes : le carré de la période croît comme le cube de la taille de l’orbite (troisième loi de Kepler).'],
speed:['Vitesse','La rapidité d’un objet, en unités par seconde (u/s). Sur une orbite, elle est maximale au point le plus proche et minimale au point le plus éloigné.'],
escape:['Vitesse de libération','La vitesse nécessaire pour partir définitivement, soit environ 1,41 (√2) fois la vitesse circulaire. Le curseur de vitesse orbitale monte jusqu’à 1,5 : vous pouvez donc l’essayer.'],
point:['Placement au point','L’objet démarre au repos, donc il tombe vers la masse la plus proche. Glissez avant de relâcher pour le lancer avec une vitesse.'],
orbitplace:['Placement en orbite','Vous choisissez l’objet à orbiter, puis vous placez le nouveau. Orbitm lui donne la vitesse d’une orbite autour de cet objet, plus la vitesse propre de celui-ci, si bien que les lunes suivent leur planète. L’aperçu en pointillés ignore l’attraction des autres corps.'],
launch:['Vitesse de lancement','En placement au point, glissez avant de relâcher. La flèche dorée montre la direction et la vitesse. Chaque tranche de 2 unités de glissement vaut 1 u/s. La ligne pointillée dorée est la trajectoire autour du corps qui attire le plus. Vous pouvez faire de même sur un objet déjà placé avec Définir la vitesse.'],
dotted:['Lignes pointillées','Vert : aperçu de l’orbite que vous placez. Blanc : orbite actuelle de l’objet sélectionné, recalculée à chaque image. Doré : trajectoire de lancement. Elles supposent que seul le corps qui attire le plus agit, donc le vrai trajet peut dériver.'],
primary:['Corps principal','Le corps plus lourd autour duquel un objet tourne surtout. Orbitm choisit le corps plus lourd qui attire le plus l’objet sélectionné. Le plus gros objet d’un système n’a pas de corps principal.'],
momentum:['Quantité de mouvement','Masse × vitesse. Quand des objets fusionnent, la quantité de mouvement totale est conservée : le nouvel objet va à la vitesse moyenne pondérée par les masses. Une grosse planète remarque à peine un petit astéroïde.'],
merge:['Collisions et fusions','Les objets qui se touchent fusionnent. L’étoile, la planète ou le trou noir le plus lourd garde son identité, et les astéroïdes sont toujours absorbés. Les masses s’additionnent, la quantité de mouvement est conservée, et la taille augmente pour que les volumes s’additionnent. De vrais impacts produisent des débris et de la chaleur, ce qu’Orbitm omet.'],
barycenter:['Barycentre','Le centre de masse d’un groupe de corps. Ils tournent autour de lui plutôt qu’autour du centre l’un de l’autre. Une grosse planète fait légèrement osciller son étoile, et Orbitm le montre car chaque corps attire tous les autres.'],
hill:['Sphère de Hill','La région autour d’une planète où sa gravité l’emporte sur celle de l’étoile. Les lunes doivent y rester, et en pratique dans environ la moitié de son rayon, pour être stables. Rayon ≈ distance à l’étoile × (masse de la planète / (3 × masse de l’étoile))^(1/3).'],
softening:['Adoucissement','Un petit nombre ajouté au carré de la distance dans la formule de gravité, pour que deux objets qui se frôlent ne reçoivent pas un coup infini. Orbitm ajoute 4 à la distance².'],
integration:['Intégration saute-mouton','La simulation avance par tout petits pas (0,01 s au maximum) et met à jour vitesse et position en alternance. Cela garde les orbites stables longtemps, là où des méthodes plus simples dérivent lentement vers l’extérieur.'],
trail:['Traînées','Des lignes pâles qui montrent où un objet est passé, avec un point toutes les 0,25 s de temps simulé. Désactivez-les avec le bouton Traînées.'],
roche:['Limite de Roche et rupture par marée','Trop près d’un corps lourd, la différence d’attraction à travers un objet peut le déchirer. Dans Orbitm, une planète qui franchit la limite (0,7 × sa taille × la racine cubique du rapport des masses, formule simplifiée) se brise en 28 astéroïdes qui gardent sa quantité de mouvement. Les fragments n’attirent pas les autres. Option : Rupture par marée.'],
habitable:['Zone habitable','La bande autour d’une étoile où une planète pourrait avoir de l’eau liquide. Orbitm donne à chaque étoile une luminosité tirée de sa masse (masse^3,5, comparée à l’étoile de référence de 20 000) et colore de 0,95 à 1,67 UA × la racine carrée de cette valeur. Les températures des planètes supposent 30 % de réflexion et aucun effet de serre.'],
lagrange:['Points de Lagrange','Cinq endroits près de deux corps en orbite où un petit objet peut les suivre. L1, L2 et L3 sont sur la droite passant par les deux corps et sont instables. L4 et L5 sont à 60° devant et derrière le plus petit corps et peuvent être stables si le plus grand est au moins 25 fois plus lourd. Orbitm dessine des positions approximatives pour l’objet sélectionné et son corps principal.'],
lensing:['Lentille gravitationnelle','Un objet massif courbe la lumière qui passe, donc les étoiles du fond semblent repoussées autour d’un trou noir, et celles juste derrière disparaissent. Orbitm utilise une formule simple de lentille ponctuelle. C’est purement visuel.'],
jets:['Rotation du disque et jets','Le gaz d’un disque d’accrétion tourne plus vite près du trou, et le côté qui vient vers vous paraît plus brillant. Les trous noirs peuvent aussi émettre des jets le long de leur axe de rotation. Orbitm anime le disque et dessine deux jets pour l’effet seulement : ils ne poussent rien.'],
follow:['Caméra de suivi','La caméra peut se verrouiller sur un objet sélectionné, ou sur le centre de masse de tout le système, et glisser avec lui. Déplacer la vue à la main relâche le verrou. Suivre le centre de masse garde tout un système à l’écran même s’il dérive.'],
rewind:['Annuler et rembobiner','Annuler (Ctrl+Z) défait vos dernières modifications : placement, suppression, édition et chargement. Rembobiner remonte dans les 60 dernières secondes de simulation. Faites glisser le curseur, puis appuyez sur Reprendre ici pour continuer depuis cet instant, ce qui efface la suite de l’historique. Les traînées sont effacées quand vous revenez en arrière.'],
energy:['Énergie orbitale','L’énergie orbitale spécifique vaut v²/2 − μ/r, où μ = G × (somme des deux masses). Négative, l’orbite est liée ; nulle, c’est une parabole ; positive, l’objet va s’échapper. Sur une orbite non perturbée elle reste constante : ses changements sur le graphique montrent l’attraction d’autres corps ou un passage rapproché.'],
units:['Unités','Normalement la distance est en u, le temps en secondes de simulation et la masse sans unité. Unités réelles convertit avec 200 u = 1 UA, 20 000 de masse = 1 masse solaire et 125,66 s = 1 an, ce qui donne à une orbite proche de la Terre une vitesse de 29,8 km/s. Les tailles sont exagérées pour rester visibles : seuls masses, distances, vitesses et temps sont convertis.']};
function renderHist(){$('vlist').innerHTML=VERS.map((v,i)=>{const f=set.lang==='fr'?VERSFR[i]:[v[1],v[2]];return`<h3>${v[0]}${i?'':' ('+tr('current')+')'} · ${f[0]}</h3><ul>${f[1].map(t=>`<li>${t}</li>`).join('')}</ul>`}).join('')}
function applyLang(){const fr=set.lang==='fr';document.documentElement.lang=set.lang;
 const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;
 while(n=w.nextNode()){const p=n.parentElement;if(!p||/^(SCRIPT|STYLE)$/.test(p.tagName)||p.closest('#dl,#vlist,#selinfo,#hint,#toast,#tip,#cn,#rwl'))continue;if(n._o===undefined)n._o=n.nodeValue;const t=n._o.trim();n.nodeValue=fr&&FR[t]?n._o.replace(t,FR[t]):n._o}
 $('dq').placeholder=tr('Search…');$('pause').textContent=tr(paused?'Resume':'Pause');folLabel();resetQuit();rwButton();renderHist();setTab(tab);$('hint').textContent='';hideTip();
 document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===set.lang))}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{set.lang=b.dataset.lang;saveSet();applyLang()});
applyLang();
[['pRoche','roche'],['pHZ','hz'],['pLag','lag'],['pReal','real'],['pLens','lens']].forEach(([id,k])=>{const b=$(id);b.classList.toggle('on',!!fx[k]);b.onclick=()=>{fx[k]=fx[k]?0:1;b.classList.toggle('on',!!fx[k])}});
loadForm();ui();
if(!(location.hash.startsWith('#s=')&&(()=>{try{return restore(dec(location.hash.slice(3)))}catch(err){return false}})()))demo();
requestAnimationFrame(loop);
</script></body></html>
